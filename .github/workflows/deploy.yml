name: tryna Prod CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # main에 대한 PR은 ci.yml이 Actions 체크로 이미 검증하지만, 직접 push(머지 포함)로
  # 워크플로가 트리거될 때도 동일한 CI를 한 번 더 게이트로 실행해 "CI 성공 후 배포"를 보장한다.
  prod-CICD:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: prod-CICD
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: tryna-backend
      ECS_CLUSTER: tryna-ecs-cluster
      ECS_SERVICE: tryna-backend-svc
      ECS_TASK_DEFINITION_FAMILY: tryna-backend-task
      CONTAINER_NAME: backend-container

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 이미지 누적으로 인한 ECS 메모리/스토리지 부족 방지: 최근 3개 초과 이미지는 자동 만료
      - name: Apply ECR lifecycle policy (keep latest 3 images)
        run: |
          aws ecr put-lifecycle-policy \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --lifecycle-policy-text file://.github/ecr/lifecycle-policy.json

      # Docker 이미지 빌드 & 푸시
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # 롤백 전략을 위해, 이번에 교체될 "현재(=배포 실패 시 되돌아갈 이전)" 리비전을 미리 기록
      - name: Capture current task definition ARN (rollback target)
        id: previous-task-def
        run: |
          ARN=$(aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_FAMILY }} \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      # 현재 Task Definition 다운로드 (렌더링 베이스)
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_FAMILY }} \
            --query taskDefinition \
            > task-definition.json

      # cgroup이 무제한(9223372036854771712)으로 보고되는 ECS 환경 대비: Task Definition 메모리를 JVM에 명시 전달
      - name: Read container memory from task definition
        id: container-memory
        run: |
          MEM=$(jq -r --arg name "${{ env.CONTAINER_NAME }}" '
            .containerDefinitions[] | select(.name==$name) | .memory // empty
          ' task-definition.json)
          if [ -z "$MEM" ] || [ "$MEM" = "null" ]; then
            MEM=$(jq -r '.memory // empty' task-definition.json)
          fi
          if [ -z "$MEM" ] || [ "$MEM" = "null" ]; then
            echo "::warning::Task Definition에서 memory를 찾지 못해 기본값 1024MB를 사용합니다."
            MEM=1024
          fi
          echo "mb=$MEM" >> "$GITHUB_OUTPUT"

      # 새 이미지 + 환경변수로 Task Definition 갱신
      - name: Render new task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: |
            SPRING_PROFILES_ACTIVE=prod
            JAVA_HEAP_PERCENT=75
            CONTAINER_MEMORY_MB=${{ steps.container-memory.outputs.mb }}
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_REPLICA_URL=${{ secrets.DB_REPLICA_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_EXPIRATION=${{ secrets.JWT_ACCESS_EXPIRATION }}
            JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}
            JWT_ISSUER=${{ secrets.JWT_ISSUER }}
            VALKEY_HOST=${{ secrets.VALKEY_HOST }}
            VALKEY_PORT=${{ secrets.VALKEY_PORT }}
            VALKEY_PASSWORD=${{ secrets.VALKEY_PASSWORD }}
            FASTAPI_BASE_URL=http://tryna-brain-svc.tryna.namespace:8000
            INTERNAL_API_KEY=${{ secrets.INTERNAL_API_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            CRYPTO_SECRET_KEY=${{ secrets.CRYPTO_SECRET_KEY }}
            FIREBASE_CREDENTIALS_BASE64=${{ secrets.FIREBASE_CREDENTIALS_BASE64 }}

      # ECS 배포 (새 리비전 등록 + 서비스 업데이트 + 안정화 대기)
      - name: Deploy to Amazon ECS
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # 배포(안정화 대기 포함)가 실패하면 직전에 기록해 둔 이전 리비전으로 즉시 되돌린다.
      - name: Rollback to previous task definition on failure
        if: failure() && steps.previous-task-def.outputs.arn != ''
        run: |
          echo "::warning::배포 실패 감지, 이전 태스크 정의로 롤백합니다: ${{ steps.previous-task-def.outputs.arn }}"
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.previous-task-def.outputs.arn }} \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }}

      # 요약
      - name: Deployment summary
        if: always()
        run: |
          echo "### Deployment Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ steps.build-image.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster**: ${{ env.ECS_CLUSTER }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: ${{ env.ECS_SERVICE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "- **Result**: 정상 배포 완료" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Result**: 배포 실패 → 이전 리비전(${{ steps.previous-task-def.outputs.arn }})으로 롤백됨" >> $GITHUB_STEP_SUMMARY
          fi
