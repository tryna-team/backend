name: tryna Backend CI

# main/develop으로 향하는 PR에서 Actions 체크로 실행되고,
# deploy.yml에서는 workflow_call로 재사용되어 "배포 전 CI 게이트" 역할도 겸한다.
on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "develop" ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 단위 테스트는 H2로 충분하지만, Flyway 마이그레이션(V*.sql)은 PostgreSQL 전용 문법을 쓰고
    # 실제 배포 환경도 Postgres/Redis(Valkey)이므로, 실제 컨테이너로 기동 검증까지 수행한다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tryna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tryna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 단위 테스트(H2, application-test.yaml) + bootJar 빌드
      - name: Test & build with Gradle
        run: ./gradlew clean build

      # 실제 Postgres/Redis 컨테이너로 애플리케이션을 기동해 Flyway 마이그레이션과
      # DB/Redis 연결을 HealthController(/health)로 검증한다.
      - name: Boot application against real infra and verify /health
        env:
          DB_URL: jdbc:postgresql://localhost:5432/tryna
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          VALKEY_HOST: localhost
          VALKEY_PORT: 6379
          JWT_SECRET: ci-dummy-secret-key-for-github-actions-min-32-bytes-long
          JWT_ISSUER: tryna-ci
          GOOGLE_CLIENT_ID: dummy-client-id-for-ci
          FASTAPI_BASE_URL: http://localhost:8000
          INTERNAL_API_KEY: ci-dummy-internal-api-key
        run: |
          set -euo pipefail
          LOG=/tmp/tryna-boot.log
          : > "$LOG"
          JAR="$(ls build/libs/*.jar | head -n 1)"

          java -jar "$JAR" \
            --spring.profiles.active=local \
            --oauth2.google.client-id=dummy-client-id-for-ci \
            >>"$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT

          code=""
          for i in $(seq 1 60); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "애플리케이션이 기동 중 종료되었습니다 (시도 $i)"
              break
            fi
            code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health || true)"
            if [ "$code" = "200" ]; then
              echo "헬스체크 성공 (DB/Redis 연결 정상)"
              exit 0
            fi
            sleep 2
          done

          echo "헬스체크 실패 (마지막 HTTP 코드=${code:-n/a})"
          echo "----- 애플리케이션 로그 (마지막 250줄) -----"
          tail -n 250 "$LOG" || true
          exit 1
