spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      max-lifetime: 1800000
      idle-timeout: 600000
  jpa:
    hibernate:
      # 배포 환경 스키마는 Flyway가 전담 관리한다. Hibernate는 스키마를 건드리지 않는다.
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
    open-in-view: false
  data:
    redis:
      host: ${VALKEY_HOST}
      port: ${VALKEY_PORT}
      password: ${VALKEY_PASSWORD}
      timeout: 5s
      ssl:
        enabled: true

logging:
  level:
    com.tryna: INFO
    org.springframework: WARN

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  issuer: ${JWT_ISSUER}

oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}

app:
  crypto:
    secret-key: ${CRYPTO_SECRET_KEY}

brain:
  base-url: ${FASTAPI_BASE_URL}
  api-key: ${INTERNAL_API_KEY}