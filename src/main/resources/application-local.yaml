spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tryna}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:1800}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600}
  issuer: ${JWT_ISSUER:tryna}
