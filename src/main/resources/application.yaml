spring:
  application:
    name: tryna
  profiles:
    active: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 이미 ddl-auto(update/validate)로 생성되어 있던 기존 스키마(local/prod)를 Flyway 도입 시점에
    # 깨뜨리지 않기 위한 설정. 스키마가 비어 있으면 baseline 없이 V1부터 정상 실행되고,
    # 이미 테이블이 존재하면 V1을 baseline으로만 기록하고 V2부터 적용한다.
    baseline-on-migrate: true
    baseline-version: 1

oauth2:
  google:
    token-url: https://oauth2.googleapis.com/token
    calendar-url: https://www.googleapis.com/calendar/v3/calendars/primary/events

firebase:
  credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}